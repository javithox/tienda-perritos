name: Database Docker Hub CI

on:
  push:
    branches:
      - main
    paths:
      - 'database/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build imagen database
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/tienda-perritos-db:latest ./database

      - name: Push imagen database
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tienda-perritos-db:latest
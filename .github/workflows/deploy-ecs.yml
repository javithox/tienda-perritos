name: Deploy to ECS

on:
  workflow_dispatch: {}
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_FRONTEND: tienda-frontend
  ECR_REPOSITORY_BACKEND: tienda-backend
  ECS_CLUSTER: tienda-perritos-cluster
  ECS_SERVICE_FRONTEND: tienda-frontend-service
  ECS_SERVICE_BACKEND: tienda-backend-service
  ECS_TASK_FAMILY_FRONTEND: tienda-frontend-task
  ECS_TASK_FAMILY_BACKEND: tienda-backend-task

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repositories if needed
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY_FRONTEND >/dev/null 2>&1 || aws ecr create-repository --repository-name $ECR_REPOSITORY_FRONTEND
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY_BACKEND >/dev/null 2>&1 || aws ecr create-repository --repository-name $ECR_REPOSITORY_BACKEND

      - name: Build and push frontend image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_FRONTEND:${GITHUB_SHA::7} ./frontend
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_FRONTEND:${GITHUB_SHA::7}

      - name: Build and push backend image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_BACKEND:${GITHUB_SHA::7} ./backend
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_BACKEND:${GITHUB_SHA::7}

      - name: Register frontend task definition
        run: |
          cat > frontend-task.json <<EOF
          {
            "family": "$ECS_TASK_FAMILY_FRONTEND",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole",
            "containerDefinitions": [
              {
                "name": "frontend",
                "image": "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_FRONTEND:${GITHUB_SHA::7}",
                "essential": true,
                "portMappings": [{"containerPort": 80, "hostPort": 80, "protocol": "tcp"}],
                "environment": [
                  {"name": "BACKEND_HOST", "value": "${{ secrets.BACKEND_PRIVATE_DNS }}"},
                  {"name": "BACKEND_PORT", "value": "3001"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/tienda-frontend",
                    "awslogs-region": "$AWS_REGION",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          aws ecs register-task-definition --cli-input-json file://frontend-task.json > /tmp/frontend-task.json

      - name: Register backend task definition
        run: |
          cat > backend-task.json <<EOF
          {
            "family": "$ECS_TASK_FAMILY_BACKEND",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "512",
            "memory": "1024",
            "executionRoleArn": "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole",
            "containerDefinitions": [
              {
                "name": "backend",
                "image": "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY_BACKEND:${GITHUB_SHA::7}",
                "essential": true,
                "portMappings": [{"containerPort": 3001, "hostPort": 3001, "protocol": "tcp"}],
                "environment": [
                  {"name": "PORT", "value": "3001"},
                  {"name": "DB_HOST", "value": "${{ secrets.DB_HOST }}"},
                  {"name": "DB_USER", "value": "${{ secrets.DB_USER }}"},
                  {"name": "DB_PASSWORD", "value": "${{ secrets.DB_PASSWORD }}"},
                  {"name": "DB_NAME", "value": "${{ secrets.DB_NAME }}"},
                  {"name": "DB_PORT", "value": "3306"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/tienda-backend",
                    "awslogs-region": "$AWS_REGION",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          aws ecs register-task-definition --cli-input-json file://backend-task.json > /tmp/backend-task.json

      - name: Update ECS services
        run: |
          FRONTEND_TASK_REV=$(python - <<'PY'
          import json,sys
          with open('/tmp/frontend-task.json') as f:
              data=json.load(f)
          print(data['taskDefinition']['taskDefinitionArn'])
          PY
          )
          BACKEND_TASK_REV=$(python - <<'PY'
          import json,sys
          with open('/tmp/backend-task.json') as f:
              data=json.load(f)
          print(data['taskDefinition']['taskDefinitionArn'])
          PY
          )
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE_FRONTEND --task-definition "$FRONTEND_TASK_REV" --desired-count 1 >/dev/null
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE_BACKEND --task-definition "$BACKEND_TASK_REV" --desired-count 1 >/dev/null
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE_FRONTEND $ECS_SERVICE_BACKEND

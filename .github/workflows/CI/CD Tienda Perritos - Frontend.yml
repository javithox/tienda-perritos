name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  build-push-deploy-frontend:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Frontend
        run: |
          cd frontend

          docker build -t tienda-frontend:${IMAGE_TAG} .

          docker tag tienda-frontend:${IMAGE_TAG} \
          ${{ secrets.ECR_REPO_URL_FRONTEND }}:${IMAGE_TAG}

      - name: Push ECR Frontend
        run: |
          docker push \
          ${{ secrets.ECR_REPO_URL_FRONTEND }}:${IMAGE_TAG}

      - name: Deploy Frontend EC2 vía SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy frontend tienda perritos" \
            --parameters '{
              "commands":[
                "set -e",
                "aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' | docker login --username AWS --password-stdin '${{ secrets.ECR_REGISTRY }}'",
                "docker pull '${{ secrets.ECR_REPO_URL_FRONTEND }}':'${{ env.IMAGE_TAG }}'",
                "docker stop tienda-frontend || true",
                "docker rm tienda-frontend || true",
                "docker image prune -af",
                "docker run -d --restart always --name tienda-frontend -p 80:80 -e BACKEND_URL='${{ secrets.EC2_BACKEND_URL }}' '${{ secrets.ECR_REPO_URL_FRONTEND }}':'${{ env.IMAGE_TAG }}'"
              ]
            }' \
            --output text

name: Frontend Tienda Perritos Docker Hub CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build imagen frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/tienda-frontend:latest ./frontend

      - name: Push imagen frontend
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tienda-frontend:latest